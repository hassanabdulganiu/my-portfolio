<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#p1Grad)" rx="16"/>
  
  <!-- Browser Window Header -->
  <rect x="30" y="25" width="540" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="55" cy="46" r="6" fill="#ef4444" />
  <circle cx="75" cy="46" r="6" fill="#f59e0b" />
  <circle cx="95" cy="46" r="6" fill="#10b981" />
  <rect x="120" y="38" width="260" height="16" rx="4" fill="#0f172a" />
  <text x="130" y="50" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">https://restaurant-ordering-demo.local</text>

  <!-- Restaurant Menu Card Mockup -->
  <g transform="translate(50, 90)">
    <!-- Food Card 1 -->
    <rect x="0" y="0" width="150" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="12" y="12" width="126" height="75" rx="6" fill="#334155"/>
    <!-- Food icon -->
    <circle cx="75" cy="50" r="22" fill="url(#accentGrad)" opacity="0.8"/>
    <text x="75" y="56" fill="#ffffff" font-family="sans-serif" font-size="18" text-anchor="middle">🍽️</text>
    <rect x="15" y="100" width="90" height="12" rx="3" fill="#cbd5e1"/>
    <rect x="15" y="120" width="60" height="10" rx="3" fill="#22c55e"/>
    <rect x="95" y="138" width="45" height="20" rx="4" fill="url(#accentGrad)"/>
    <text x="117" y="152" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">+ Add</text>

    <!-- Food Card 2 -->
    <rect x="175" y="0" width="150" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="187" y="12" width="126" height="75" rx="6" fill="#334155"/>
    <circle cx="250" cy="50" r="22" fill="url(#accentGrad)" opacity="0.8"/>
    <text x="250" y="56" fill="#ffffff" font-family="sans-serif" font-size="18" text-anchor="middle">🍕</text>
    <rect x="190" y="100" width="80" height="12" rx="3" fill="#cbd5e1"/>
    <rect x="190" y="120" width="55" height="10" rx="3" fill="#22c55e"/>
    <rect x="270" y="138" width="45" height="20" rx="4" fill="url(#accentGrad)"/>
    <text x="292" y="152" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">+ Add</text>

    <!-- Sidebar / Cart Preview -->
    <rect x="350" y="0" width="150" height="170" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="365" y="26" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Order Summary</text>
    <line x1="365" y1="36" x2="485" y2="36" stroke="#334155" stroke-width="1"/>
    <rect x="365" y="48" width="70" height="8" rx="2" fill="#94a3b8"/>
    <rect x="455" y="48" width="30" height="8" rx="2" fill="#38bdf8"/>
    <rect x="365" y="66" width="60" height="8" rx="2" fill="#94a3b8"/>
    <rect x="455" y="66" width="30" height="8" rx="2" fill="#38bdf8"/>
    <rect x="365" y="120" width="120" height="28" rx="6" fill="#25d366"/>
    <text x="425" y="138" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">WhatsApp Order 💬</text>
  </g>

  <!-- Title footer -->
  <text x="300" y="325" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="18" text-anchor="middle" font-weight="bold">Restaurant Website &amp; Online Ordering Demo</text>
  <text x="300" y="350" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">HTML5 &bull; CSS3 &bull; JavaScript &bull; WhatsApp API</text>
</svg>