<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#p2Grad)" rx="16"/>
  
  <!-- Browser Window Header -->
  <rect x="30" y="25" width="540" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="55" cy="46" r="6" fill="#ef4444" />
  <circle cx="75" cy="46" r="6" fill="#f59e0b" />
  <circle cx="95" cy="46" r="6" fill="#10b981" />
  <rect x="120" y="38" width="240" height="16" rx="4" fill="#0f172a" />
  <text x="130" y="50" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">https://zampler-td-group.com</text>

  <!-- Financial Platform Mockup -->
  <g transform="translate(50, 90)">
    <!-- Hero Banner Mockup -->
    <rect x="0" y="0" width="500" height="70" rx="8" fill="url(#finGrad)" opacity="0.9"/>
    <text x="25" y="30" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">ZAMPLER TD GROUP</text>
    <text x="25" y="50" fill="#bfdbfe" font-family="sans-serif" font-size="11">Daily Life's Finances Re-imagined For All</text>

    <!-- Grid Columns -->
    <rect x="0" y="85" width="155" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="28" cy="110" r="14" fill="#3b82f6" opacity="0.3"/>
    <text x="28" y="115" fill="#60a5fa" font-family="sans-serif" font-size="13" text-anchor="middle">💼</text>
    <text x="50" y="113" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Wealth Mgmt</text>
    <rect x="15" y="135" width="125" height="8" rx="2" fill="#475569"/>
    <rect x="15" y="150" width="90" height="8" rx="2" fill="#475569"/>

    <rect x="172" y="85" width="155" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="200" cy="110" r="14" fill="#10b981" opacity="0.3"/>
    <text x="200" y="115" fill="#34d399" font-family="sans-serif" font-size="13" text-anchor="middle">📊</text>
    <text x="222" y="113" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Investments</text>
    <rect x="187" y="135" width="125" height="8" rx="2" fill="#475569"/>
    <rect x="187" y="150" width="85" height="8" rx="2" fill="#475569"/>

    <rect x="345" y="85" width="155" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="373" cy="110" r="14" fill="#8b5cf6" opacity="0.3"/>
    <text x="373" y="115" fill="#a78bfa" font-family="sans-serif" font-size="13" text-anchor="middle">🛡️</text>
    <text x="395" y="113" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Security</text>
    <rect x="360" y="135" width="125" height="8" rx="2" fill="#475569"/>
    <rect x="360" y="150" width="75" height="8" rx="2" fill="#475569"/>
  </g>

  <!-- Title footer -->
  <text x="300" y="325" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="18" text-anchor="middle" font-weight="bold">Zampler TD Group — Corporate Financial Platform</text>
  <text x="300" y="350" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">HTML5 &bull; CSS3 &bull; Bootstrap 5 &bull; Responsive Layout</text>
</svg>